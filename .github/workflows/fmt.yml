name: Rust Format

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, 'gravity-testnet-v**']
  workflow_dispatch:

# Cancel redundant runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin rustfmt so CI does not drift with floating `nightly`.
      # Pair with rustfmt.toml `wrap_comments = false` so we do not need to
      # churn unrelated long comments when rustfmt's wrap heuristics change.
      - name: Install pinned nightly rustfmt
        run: |
          rustup toolchain install nightly-2026-09-05 --component rustfmt
      - name: Check formatting
        run: cargo +nightly-2026-09-05 fmt --all -- --check
